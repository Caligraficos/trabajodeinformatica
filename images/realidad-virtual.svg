<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Icono animado de visor de realidad virtual">
  <style>
    .ring { transform-origin: 240px 150px; animation: spin 16s linear infinite; }
    .ring2 { transform-origin: 240px 150px; animation: spin 26s linear infinite reverse; }
    .visor { animation: float 4.6s ease-in-out infinite; transform-origin: 240px 150px; }
    .beat { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 3.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes draw { 0% { stroke-dashoffset: 400; } 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -400; } }
  </style>
  <defs>
    <linearGradient id="gV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1ee6"/>
      <stop offset="1" stop-color="#0f7c86"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="#f4f5f9"/>
  <circle class="ring" cx="240" cy="150" r="108" fill="none" stroke="url(#gV)" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="1 8"/>
  <circle class="ring2" cx="240" cy="150" r="128" fill="none" stroke="#0d0d1a" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="30 14"/>
  <g class="visor">
    <rect x="170" y="112" width="140" height="78" rx="34" fill="none" stroke="url(#gV)" stroke-width="1.6"/>
    <circle cx="206" cy="151" r="18" fill="none" stroke="url(#gV)" stroke-width="1.4"/>
    <circle cx="274" cy="151" r="18" fill="none" stroke="url(#gV)" stroke-width="1.4"/>
    <path d="M224 151 H256" stroke="#0d0d1a" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>
  <path class="beat" d="M60 232 H150 L166 214 L182 246 L198 226 L210 232 H420" fill="none" stroke="url(#gV)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
