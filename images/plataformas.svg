<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Icono animado de tableta">
  <style>
    .ring { transform-origin: 240px 150px; animation: spin 18s linear infinite; }
    .tab { animation: float 4.6s ease-in-out infinite; transform-origin: 240px 150px; }
    .glow { animation: pulse 3.2s ease-in-out infinite; transform-origin: 240px 150px; }
    .play { animation: pulse 3.2s ease-in-out infinite .6s; transform-origin: 240px 150px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="gP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1ee6"/>
      <stop offset="1" stop-color="#0f7c86"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="#e6e9f2"/>
  <circle class="ring" cx="240" cy="150" r="104" fill="none" stroke="url(#gP)" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 10"/>
  <circle cx="240" cy="150" r="78" fill="none" stroke="#0d0d1a" stroke-opacity="0.08" stroke-width="1"/>
  <g class="tab">
    <rect x="186" y="84" width="108" height="136" rx="18" fill="none" stroke="url(#gP)" stroke-width="1.6"/>
    <rect x="198" y="100" width="84" height="104" rx="6" fill="none" stroke="#0d0d1a" stroke-opacity="0.15" stroke-width="1"/>
    <path class="play" d="M228 138 L256 152 L228 166 Z" fill="url(#gP)"/>
  </g>
  <circle class="glow" cx="120" cy="150" r="3" fill="#0f7c86"/>
  <circle class="glow" cx="360" cy="150" r="3" fill="#6b1ee6"/>
</svg>
