<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Icono animado de corazón con latido">
  <style>
    .ring { transform-origin: 240px 150px; animation: spin 20s linear infinite; }
    .heart { animation: beat 2.4s ease-in-out infinite; transform-origin: 240px 150px; }
    .moon { animation: float 5s ease-in-out infinite; transform-origin: 240px 150px; }
    .dot { animation: twinkle 3s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.08); } 30% { transform: scale(1); } 45% { transform: scale(1.05); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="gR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1ee6"/>
      <stop offset="1" stop-color="#0f7c86"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="#f4f5f9"/>
  <circle class="ring" cx="240" cy="150" r="104" fill="none" stroke="url(#gR)" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 10"/>
  <g class="heart">
    <path d="M240 186 C200 160 184 136 196 116 C206 100 230 102 240 120 C250 102 274 100 284 116 C296 136 280 160 240 186 Z" fill="none" stroke="url(#gR)" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <g class="moon">
    <path d="M360 96 A22 22 0 1 0 380 124 A17 17 0 1 1 360 96 Z" fill="none" stroke="#0d0d1a" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>
  <circle class="dot" cx="110" cy="200" r="2.5" fill="#0f7c86"/>
  <circle class="dot" cx="120" cy="92" r="2" fill="#6b1ee6" style="animation-delay:-1s"/>
  <circle class="dot" cx="380" cy="208" r="2" fill="#0f7c86" style="animation-delay:-2s"/>
</svg>
